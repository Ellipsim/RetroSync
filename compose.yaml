services:
  postgres:
    image: postgres:17-alpine
    container_name: retrosync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - retrosync-network

  user-service:
    build:
      context: ./services/user-service
    image: retrosync-user-service:1.0
    container_name: retrosync-user-service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/retrosync_users
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - retrosync-network

  save-service:
    build:
      context: ./services/save-service
    image: retrosync-save-service:1.0
    container_name: retrosync-save-service
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/retrosync_saves
      STORAGE_LOCATION: /app/uploads
    volumes:
      - save_files:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - retrosync-network

  api-gateway:
    build:
      context: ./services/api-gateway
    image: retrosync-api-gateway:1.0
    container_name: retrosync-api-gateway
    restart: unless-stopped
    environment:
      USER_SERVICE_URL: http://user-service:8081
      SAVE_SERVICE_URL: http://save-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - user-service
      - save-service
    networks:
      - retrosync-network

  frontend:
    build:
      context: ./frontend
    image: retrosync-frontend:1.0
    container_name: retrosync-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - retrosync-network

volumes:
  postgres_data:
  save_files:

networks:
  retrosync-network:
    driver: bridge
