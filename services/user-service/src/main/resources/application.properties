spring.application.name=user-service

server.port=8081

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/retrosync_users
spring.datasource.username=${POSTGRES_USER:admin_retrosync}
spring.datasource.password=${POSTGRES_PASSWORD:admin_retrosync}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Logs
# Silogging.level.org.springframework.security=TRACE