spring.application.name=api-gateway
server.port=8080

# Microservices
retrosync.services.user-url=${USER_SERVICE_URL:http://localhost:8081}
retrosync.services.save-url=${SAVE_SERVICE_URL:http://localhost:8082}

# Actuator
management.endpoints.web.exposure.include=health,info

# Desactivar el procesamiento multipart del Gateway
spring.servlet.multipart.enabled=false